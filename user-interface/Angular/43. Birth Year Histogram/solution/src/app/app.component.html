<div class="wrapper">
  <ng-container *ngIf="chartState$ | async as state">
    <div class="status" role="status">
      {{
        state.status === 'loading'
          ? 'Loading…'
          : state.status === 'error'
            ? 'Unable to load birth-year data.'
            : ''
      }}
    </div>
    <div class="chart">
      <div class="chart__y-axis">
        <div class="chart__y-axis__items">
          <div
            *ngFor="let yValue of state.data.maxYAxisValue | yAxisValues"
            class="chart__y-axis__item">
            {{ yValue }}
          </div>
        </div>
        <div class="chart__y-axis__zero">0</div>
      </div>
      <div class="chart__main">
        <div class="chart__main__bars">
          <div
            *ngFor="let bucket of bucketLabels"
            class="chart__main__bars__item"
            [style.height]="
              (state.data.frequency[bucket]
                | barHeight: state.data.maxYAxisValue) + '%'
            "></div>
        </div>
        <div class="chart__x-axis">
          <div *ngFor="let bucket of bucketLabels" class="chart__x-axis__item">
            {{ bucket }}
          </div>
        </div>
      </div>
    </div>
    <button [disabled]="state.status === 'loading'" (click)="refreshData()">
      Refresh
    </button>
  </ng-container>
</div>
