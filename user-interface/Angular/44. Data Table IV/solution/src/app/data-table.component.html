<table>
  <thead>
    <tr>
      <th *ngFor="let column of columns">
        <button type="button" (click)="sortBy(column.key)">
          {{ column.label }}
        </button>
        <div *ngIf="column.filterType === 'string'" class="filter-input">
          <input
            [attr.aria-label]="'Filter ' + column.label"
            placeholder="Search..."
            type="search"
            [value]="stringFilterValue(column.key)"
            (input)="setStringFilter(column.key, $event)" />
        </div>
        <div
          *ngIf="column.filterType === 'range'"
          class="filter-input filter-input--range">
          <input
            [attr.aria-label]="column.label + ' min'"
            placeholder="Min"
            type="number"
            [value]="rangeFilterValue(column.key, 'min')"
            (input)="setRangeFilter(column.key, 'min', $event)" />
          <input
            [attr.aria-label]="column.label + ' max'"
            placeholder="Max"
            type="number"
            [value]="rangeFilterValue(column.key, 'max')"
            (input)="setRangeFilter(column.key, 'max', $event)" />
        </div>
      </th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let item of pageData">
      <td *ngFor="let column of columns">
        {{ column.renderCell(item) }}
      </td>
    </tr>
  </tbody>
</table>

<hr />

<div class="pagination">
  <select aria-label="Page size" (change)="changePageSize($event)">
    <option *ngFor="let size of pageSizes" [value]="size">
      Show {{ size }}
    </option>
  </select>
  <div class="pages">
    <button type="button" [disabled]="page <= 1" (click)="page = page - 1">
      Prev
    </button>
    <span *ngIf="totalPages === 0">0 pages</span>
    <span *ngIf="totalPages > 0" aria-label="Page number">
      Page {{ page }} of {{ totalPages }}
    </span>
    <button
      type="button"
      [disabled]="totalPages === 0 || page >= totalPages"
      (click)="page = page + 1">
      Next
    </button>
  </div>
</div>
