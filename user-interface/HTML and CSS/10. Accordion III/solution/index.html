<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <div class="wrapper">
      <div class="accordion">
        <div class="accordion-item">
          <button
            aria-controls="accordion-panel-html"
            aria-expanded="false"
            class="accordion-item-title"
            data-accordion-header
            id="accordion-header-html"
            type="button">
            HTML <span aria-hidden="true" class="accordion-icon"></span>
          </button>
          <div
            aria-labelledby="accordion-header-html"
            class="accordion-item-contents"
            hidden
            id="accordion-panel-html"
            role="region">
            The HyperText Markup Language or HTML is the standard markup
            language for documents designed to be displayed in a web browser.
          </div>
        </div>
        <div class="accordion-item">
          <button
            aria-controls="accordion-panel-css"
            aria-expanded="false"
            class="accordion-item-title"
            data-accordion-header
            id="accordion-header-css"
            type="button">
            CSS <span aria-hidden="true" class="accordion-icon"></span>
          </button>
          <div
            aria-labelledby="accordion-header-css"
            class="accordion-item-contents"
            hidden
            id="accordion-panel-css"
            role="region">
            Cascading Style Sheets describes the presentation of a document.
          </div>
        </div>
        <div class="accordion-item">
          <button
            aria-controls="accordion-panel-js"
            aria-expanded="false"
            class="accordion-item-title"
            data-accordion-header
            id="accordion-header-js"
            type="button">
            JavaScript <span aria-hidden="true" class="accordion-icon"></span>
          </button>
          <div
            aria-labelledby="accordion-header-js"
            class="accordion-item-contents"
            hidden
            id="accordion-panel-js"
            role="region">
            JavaScript is one of the core technologies of the Web.
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="src/index.js"></script>
  </body>
</html>
